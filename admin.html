<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Vanatvam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <div class="dashboard-header">
                <h1>Admin Dashboard</h1>
                <div class="user-info">
                    <span id="userRole"></span>
                    <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
                </div>
            </div>

            <div class="customer-form">
                <h2>Add New Customer</h2>
                <form id="customerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="mobile">Mobile Number *</label>
                            <input type="tel" id="mobile" name="mobile" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="plotNumber">Plot Number *</label>
                            <input type="text" id="plotNumber" name="plotNumber" required>
                        </div>
                        <div class="form-group">
                            <label for="squareFeet">Square Feet *</label>
                            <input type="number" id="squareFeet" name="squareFeet" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="projectName">Project Name *</label>
                            <input type="text" id="projectName" name="projectName" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
                        <button type="submit" class="btn btn-primary">Add Customer</button>
                    </div>
                </form>
            </div>

            <div class="search-section">
                <h2>Customers</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, mobile, plot number, or project name...">
                </div>
            </div>

            <div class="table-container">
                <table id="customersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Plot Number</th>
                            <th>Square Feet</th>
                            <th>Project Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody">
                        <tr>
                            <td colspan="6" class="no-data">No customers found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - Vanatvam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">
                <div class="logo-container">
                    <div class="logo-inner">
                        <div class="logo-text-top">VANATVAM</div>
                        <div class="logo-icon">🌿</div>
                        <div class="logo-text-bottom">SUSTAINABLE</div>
                    </div>
                </div>
                <h1>Vanatvam</h1>
            </div>
            <button class="menu-toggle" id="menuToggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="tasks.html" class="nav-link">Tasks</a>
                <a href="calendar.html" class="nav-link">Calendar</a>
                <a href="customer-list.html" class="nav-link">Customers</a>
                <a href="add-customer.html" class="nav-link active">Add Customer</a>
                <span id="userRole" class="nav-user-info" style="display: none;"></span>
                <a href="#" class="nav-link nav-link-logout" onclick="handleLogout(); return false;">Logout</a>
            </div>
        </nav>

        <div class="dashboard">
            <div class="customer-form">
                <h2>Add New Customer</h2>
                <form id="customerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="mobile">Mobile Number *</label>
                            <input type="tel" id="mobile" name="mobile" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="plotNumber">Plot Number *</label>
                            <input type="text" id="plotNumber" name="plotNumber" required>
                        </div>
                        <div class="form-group">
                            <label for="squareFeet">Square Feet *</label>
                            <input type="number" id="squareFeet" name="squareFeet" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="projectName">Project Name *</label>
                            <select id="projectName" name="projectName" required>
                                <option value="">Select Project</option>
                                <option value="Madhuvana">Madhuvana</option>
                                <option value="Shukavana">Shukavana</option>
                                <option value="Saptavana">Saptavana</option>
                                <option value="Anantavana">Anantavana</option>
                                <option value="Brindavana">Brindavana</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
                        <button type="submit" class="btn btn-primary">Add Customer</button>
                    </div>
                </form>
                <div id="successMessage" class="success-message"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="add-customer.js"></script>
</body>
</html>
